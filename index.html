<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="description" content="windyduan — research, software, open source, and things worth trying.">
<meta property="og:title" content="windyduan">
<meta property="og:description" content="Research, software, open source, and things worth trying.">
<meta property="og:type" content="website">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<title>windyduan</title>
</head>
<body>
<header class="topbar" id="topbar">
  <a class="brand" href="#" id="brandHome">
    <span class="wordmark">windyduan</span>
    <small id="brandSub">个人主页 / 作品 / 兴趣</small>
  </a>
  <nav class="nav" id="topNav" aria-label="Main navigation"></nav>
  <div class="top-actions">
    <button class="icon-btn" id="langBtn" aria-label="Switch language">EN</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="icon" id="themeIcon" viewBox="0 0 24 24"></svg>
    </button>
  </div>
</header>

<main class="carousel" id="carousel" aria-label="Portfolio carousel">
  <section class="slide hero" data-slide="home" aria-label="Home">
    <div class="shell slide-inner">
      <div class="hero-grid">
        <div class="reveal">
          <div class="kicker">
            <svg class="icon" viewBox="0 0 24 24"><path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8Z"/></svg>
            <span id="kickerText"></span>
          </div>
          <h1 class="display"><span class="wordmark">windyduan</span><br><span id="headline"></span></h1>
          <p class="hero-copy" id="intro"></p>
          <div class="hero-actions" id="heroLinks"></div>
          <p class="swipe-hint" id="swipeHint"></p>
        </div>

        <aside class="field-card reveal" aria-label="Current exploration">
          <div class="sheet a"></div>
          <div class="sheet b"></div>
          <div class="sheet front">
            <div class="sheet-label">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-5 2 2-5z"/></svg>
              NOW EXPLORING
            </div>
            <svg class="sheet-visual" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="50" cy="50" r="29"/>
              <ellipse cx="50" cy="50" rx="42" ry="15"/>
              <ellipse cx="50" cy="50" rx="42" ry="15" transform="rotate(58 50 50)"/>
              <circle cx="50" cy="50" r="3" fill="currentColor" stroke="none"/>
            </svg>
            <h2 class="display" id="curiousTitle"></h2>
            <p id="curiousBody"></p>
            <div class="chips" id="exploreChips"></div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <section class="slide" data-slide="work" aria-label="Selected work">
    <div class="shell slide-inner">
      <div class="section-grid">
        <aside class="section-side reveal">
          <div class="section-num">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
            01 / WORK
          </div>
          <h2 class="display" id="workTitle"></h2>
          <p id="workBody"></p>
        </aside>
        <div class="project-deck" id="projectDeck"></div>
      </div>
    </div>
  </section>

  <section class="slide" data-slide="papers" aria-label="Research and publications">
    <div class="shell slide-inner">
      <div class="section-grid">
        <aside class="section-side reveal">
          <div class="section-num">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/></svg>
            02 / RESEARCH
          </div>
          <h2 class="display" id="papersTitle"></h2>
          <p id="papersBody"></p>
        </aside>
        <div class="paper-stack reveal" id="publicationDeck"></div>
      </div>
    </div>
  </section>

  <section class="slide" data-slide="oss" aria-label="Open source">
    <div class="shell slide-inner">
      <div class="section-grid">
        <aside class="section-side reveal">
          <div class="section-num">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 5h4a4 4 0 0 1 4 4v8M6 7v8a4 4 0 0 0 4 4h6"/></svg>
            03 / OSS
          </div>
          <h2 class="display" id="ossTitle"></h2>
          <p id="ossBody"></p>
        </aside>
        <div>
          <div class="oss-note reveal" id="ossThanks"></div>
          <div class="contrib-list reveal" id="contribDeck"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="slide" data-slide="interests" aria-label="Interests">
    <div class="shell slide-inner">
      <div class="section-grid">
        <aside class="section-side reveal">
          <div class="section-num">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-5 2 2-5z"/></svg>
            04 / INTERESTS
          </div>
          <h2 class="display" id="interestsTitle"></h2>
          <p id="interestsBody"></p>
        </aside>
        <div class="interest-board" id="interestBoard"></div>
      </div>
    </div>
  </section>

  <section class="slide" data-slide="profile" aria-label="Profile">
    <div class="shell slide-inner">
      <div class="profile-grid">
        <article class="profile-card reveal">
          <div class="kicker">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
            PROFILE
          </div>
          <h2 class="display" id="profileTitle"></h2>
          <p id="profileCopy"></p>
          <div class="explore-row" id="exploreRow"></div>
          <div class="profile-links" id="profileLinks"></div>
          <div class="profile-rule"><strong>A small rule:</strong> <span id="profileRule"></span></div>
        </article>

        <aside class="cv-card reveal">
          <div class="cv-head">
            <span>CV / EXPERIENCE</span>
            <div class="cv-badge">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18"/></svg>
            </div>
          </div>
          <h3 class="display" id="cvTitle"></h3>
          <p id="cvBody"></p>
          <div class="cv-lines"><i class="cv-line"></i><i class="cv-line"></i><i class="cv-line"></i><i class="cv-line"></i></div>
          <div class="cv-meta" id="profileMeta"></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<nav class="carousel-controls" aria-label="Carousel controls">
  <button class="arrow" id="prevBtn" aria-label="Previous slide">
    <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="track-nav" id="trackNav"></div>
  <span class="counter" id="counter">01 / 06</span>
  <button class="arrow" id="nextBtn" aria-label="Next slide">
    <svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</nav>

<script src="./site-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
